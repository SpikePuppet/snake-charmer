  <!-- Accent glow behind snake -->
  <circle cx="330" cy="315" r="200" fill="url(#snakeGlow)"/>

  <!-- Snake icon (scaled up from favicon) -->
  <g transform="translate(220, 200) scale(7)">
    <path d="M10 28c0-4 3-7 7-7s7-3 7-7-3-7-7-7" fill="none" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="14.5" cy="6.5" rx="5.5" ry="5" fill="#4ade80"/>
    <circle cx="16" cy="5.5" r="1.6" fill="#064e3b"/>
    <circle cx="16.7" cy="5" r="0.6" fill="white"/>
    <path d="M9.5 7.5L7 9.5M9.5 7.5L7.5 5.5" fill="none" stroke="#f87171" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Title -->
  <text x="560" y="270" font-family="Outfit, system-ui, sans-serif" font-weight="700" font-size="72" fill="#f0f0f5" letter-spacing="-1">Snake Charmer</text>

  <!-- Divider -->
  <rect x="560" y="300" width="80" height="3" rx="1.5" fill="#6e8fff" opacity="0.6"/>

  <!-- Subtitle -->
  <text x="560" y="355" font-family="DM Sans, system-ui, sans-serif" font-weight="400" font-size="30" fill="#8888a0">Python docs, beautifully styled</text>

  <!-- Version badge -->
  <rect x="560" y="390" width="100" height="36" rx="8" fill="#111219" stroke="#1e1f2e" stroke-width="1"/>
  <text x="610" y="414" font-family="JetBrains Mono, monospace" font-weight="500" font-size="16" fill="#6e8fff" text-anchor="middle">3.14</text>

  <rect x="672" y="390" width="100" height="36" rx="8" fill="#111219" stroke="#1e1f2e" stroke-width="1"/>
  <text x="722" y="414" font-family="JetBrains Mono, monospace" font-weight="500" font-size="16" fill="#4ade80" text-anchor="middle">3.13</text>

  <rect x="784" y="390" width="100" height="36" rx="8" fill="#111219" stroke="#1e1f2e" stroke-width="1"/>
  <text x="834" y="414" font-family="JetBrains Mono, monospace" font-weight="500" font-size="16" fill="#8888a0" text-anchor="middle">3.12</text>

